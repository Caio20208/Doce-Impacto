<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doce Impacto</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="topo">
      <div class="topo-header">
        <span class="tag">Análise com IA</span>
        <button id="toggleTheme" class="theme-btn">🌙</button>
      </div>

      <h1>DOCE IMPACTO D.I.A</h1>
      <p class="subtitle">
        Detector inteligente para análise visual de produtos usando câmera e inteligência artificial.
      </p>
    </div>

    <div class="camera-box">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <div class="scan-line" id="scanLine"></div>
    </div>

    <div class="buttons">
      <button id="openCamera">Abrir câmera</button>
      <button id="closeCamera">Desligar câmera</button>
      <button id="analyze">Analisar</button>
    </div>

    <div id="status">Aguardando...</div>
    <div id="details"></div>

    <div class="history-box">
      <div class="history-header">
        <h2>Histórico de Análises</h2>
        <button id="clearHistory" class="small-btn">Limpar</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-history">Nenhuma análise realizada ainda.</p>
      </div>
    </div>
  </div>
</body>
</html>
